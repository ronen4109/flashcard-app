<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English-Hebrew Flashcards</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f4; 
            padding: 20px;
        }
        .card {
            width: 80%; 
            max-width: 400px; 
            margin: 30px auto; 
            padding: 40px; 
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, background 0.5s ease, opacity 0.5s;
            opacity: 0;
        }
        .fade-in {
            opacity: 1;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .button:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }
        .progress {
            width: 80%;
            max-width: 400px;
            height: 10px;
            margin: 10px auto;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #007BFF;
            transition: width 0.3s;
        }
        select {
            margin-top: 10px;
            padding: 8px;
            font-size: 16px;
        }
        #hardWordsList {
            margin-top: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        #hardWordsList ul {
            list-style: none;
            padding: 0;
        }
        #hardWordsList li {
            margin: 5px 0;
        }
        .remove-button {
            margin-left: 10px;
            color: red;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>English-Hebrew Flashcards</h2>

    <div>
        <label for="categoryFilter">Choose category:</label>
        <select id="categoryFilter" onchange="applyFilter()">
            <option value="all">All</option>
            <option value="Noun">Nouns</option>
            <option value="Verb">Verbs</option>
            <option value="Adjective">Adjectives</option>
            <option value="Other">Other</option>
            <option value="hard">Hard Words ⭐</option>
        </select>
    </div>

    <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="flashcard" class="card fade-in" onclick="flipCard()">
        <p id="word">action</p>
    </div>
    <button class="button" onclick="prevCard()">Previous</button>
    <button class="button" onclick="nextCard()">Next</button>
    <button class="button" onclick="speakWord()">🔊 Speak</button>
    <button class="button" onclick="shuffleCards()">🔀 Shuffle</button>
    <button class="button" onclick="markHardWord()">⭐ קשה לי</button>

    <div id="hardWordsList">
        <h3>⭐ מילים שקשה לי איתן</h3>
        <ul id="hardList"></ul>
    </div>

    <script>
        const allFlashcards = [
            { english: "action", hebrew: "פעולה", category: "Noun" },
            { english: "adventure", hebrew: "הרפתקה", category: "Noun" },
            { english: "arrival", hebrew: "הגעה", category: "Noun" },
            { english: "conversation", hebrew: "שיחה", category: "Noun" },
            { english: "difficulty", hebrew: "קושי", category: "Noun" },
            { english: "Earth", hebrew: "כדור הארץ", category: "Noun" },
            { english: "effect", hebrew: "השפעה", category: "Noun" },
            { english: "energy", hebrew: "אנרגיה", category: "Noun" },
            { english: "experience", hebrew: "ניסיון / חוויה", category: "Noun" },
            { english: "hero", hebrew: "גיבור", category: "Noun" },
            { english: "opinion", hebrew: "דעה", category: "Noun" },
            { english: "purpose", hebrew: "מטרה", category: "Noun" },
            { english: "sort", hebrew: "סוג", category: "Noun" },
            { english: "space", hebrew: "חלל", category: "Noun" },
            { english: "beat", hebrew: "להכות / לנצח", category: "Verb" },
            { english: "fight", hebrew: "להילחם", category: "Verb" },
            { english: "land", hebrew: "לנחות", category: "Verb" },
            { english: "manage", hebrew: "לנהל / להסתדר", category: "Verb" },
            { english: "save", hebrew: "להציל / לשמור", category: "Verb" },
            { english: "impossible", hebrew: "בלתי אפשרי", category: "Adjective" },
            { english: "ordinary", hebrew: "רגיל", category: "Adjective" },
            { english: "real", hebrew: "אמיתי", category: "Adjective" },
            { english: "simple", hebrew: "פשוט", category: "Adjective" },
            { english: "wonderful", hebrew: "נהדר", category: "Adjective" },
            { english: "although", hebrew: "למרות", category: "Other" },
            { english: "especially", hebrew: "במיוחד", category: "Other" },
            { english: "in fact", hebrew: "למעשה", category: "Other" },
            { english: "throughout", hebrew: "לאורך / בכל", category: "Other" }
        ];

        let flashcards = [...allFlashcards];
        let currentIndex = 0;
        let showingEnglish = true;
        let hardWords = JSON.parse(localStorage.getItem("hardWords")) || [];

        function updateCard() {
            if (flashcards.length === 0) {
                document.getElementById("word").innerText = "No words to show.";
                return;
            }
            showingEnglish = true;
            const card = document.getElementById("flashcard");
            card.style.opacity = 0;
            setTimeout(() => {
                document.getElementById("word").innerText = flashcards[currentIndex].english;
                card.style.backgroundColor = getColor(currentIndex);
                card.style.opacity = 1;
                updateProgress();
            }, 300);
        }

        function flipCard() {
            if (flashcards.length === 0) return;
            showingEnglish = !showingEnglish;
            document.getElementById("word").innerText = showingEnglish ? flashcards[currentIndex].english : flashcards[currentIndex].hebrew;
        }

        function nextCard() {
            if (flashcards.length === 0) return;
            currentIndex = (currentIndex + 1) % flashcards.length;
            updateCard();
        }

        function prevCard() {
            if (flashcards.length === 0) return;
            currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
            updateCard();
        }

        function speakWord() {
            if (flashcards.length === 0) return;
            const word = flashcards[currentIndex].english;
            const speech = new SpeechSynthesisUtterance(word);
            speech.lang = "en-US";
            window.speechSynthesis.speak(speech);
        }

        function getColor(index) {
            const colors = ["#FFADAD", "#FFD6A5", "#FDFFB6", "#CAFFBF", "#9BF6FF", "#A0C4FF", "#BDB2FF", "#FFC6FF"];
            return colors[index % colors.length];
        }

        function shuffleCards() {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function updateProgress() {
            const progress = flashcards.length === 0 ? 0 : ((currentIndex + 1) / flashcards.length) * 100;
            document.getElementById("progressBar").style.width = progress + "%";
        }

        function applyFilter() {
            const category = document.getElementById("categoryFilter").value;
            if (category === "all") {
                flashcards = [...allFlashcards];
            } else if (category === "hard") {
                flashcards = allFlashcards.filter(card => hardWords.some(w => w === card.english));
            } else {
                flashcards = allFlashcards.filter(card => card.category === category);
            }
            currentIndex = 0;
            updateCard();
        }

        function markHardWord() {
            const current = flashcards[currentIndex];
            if (!hardWords.includes(current.english)) {
                hardWords.push(current.english);
                localStorage.setItem("hardWords", JSON.stringify(hardWords));
                renderHardWords();
            }
        }

        function removeHardWord(word) {
            hardWords = hardWords.filter(w => w !== word);
            localStorage.setItem("hardWords", JSON.stringify(hardWords));
            renderHardWords();
            applyFilter();
        }

        function renderHardWords() {
            const list = document.getElementById("hardList");
            list.innerHTML = "";
            hardWords.forEach(word => {
                const li = document.createElement("li");
                li.textContent = word;
                const removeBtn = document.createElement("button");
                removeBtn.textContent = "❌";
                removeBtn.className = "remove-button";
                removeBtn.onclick = () => removeHardWord(word);
                li.appendChild(removeBtn);
                list.appendChild(li);
            });
        }

        renderHardWords();
        updateCard();
    </script>
</body>
</html>
