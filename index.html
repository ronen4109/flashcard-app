<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English-Hebrew Flashcards</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f4; 
            padding: 20px;
        }
        .card {
            width: 80%; 
            max-width: 400px; 
            margin: 50px auto; 
            padding: 40px; 
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, background 0.5s ease, opacity 0.5s;
            opacity: 0;
        }
        .fade-in {
            opacity: 1;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .button {
            padding: 12px 20px;
            margin: 15px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .button:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h2>English-Hebrew Flashcards</h2>
    <div id="flashcard" class="card fade-in" onclick="flipCard()">
        <p id="word">action</p>
    </div>
    <button class="button" onclick="prevCard()">Previous</button>
    <button class="button" onclick="nextCard()">Next</button>
    <button class="button" onclick="speakWord()">🔊 Speak</button>

    <script>
        const flashcards = [
            { english: "action", hebrew: "פעולה" },
            { english: "adventure", hebrew: "הרפתקה" },
            { english: "arrival", hebrew: "הגעה" },
            { english: "conversation", hebrew: "שיחה" },
            { english: "difficulty", hebrew: "קושי" },
            { english: "Earth", hebrew: "כדור הארץ" },
            { english: "effect", hebrew: "השפעה" },
            { english: "energy", hebrew: "אנרגיה" },
            { english: "experience", hebrew: "ניסיון / חוויה" },
            { english: "hero", hebrew: "גיבור" },
            { english: "opinion", hebrew: "דעה" },
            { english: "purpose", hebrew: "מטרה" },
            { english: "sort", hebrew: "סוג" },
            { english: "space", hebrew: "חלל" },
            { english: "beat", hebrew: "להכות / לנצח" },
            { english: "fight", hebrew: "להילחם" },
            { english: "land", hebrew: "לנחות" },
            { english: "manage", hebrew: "לנהל / להסתדר" },
            { english: "save", hebrew: "להציל / לשמור" },
            { english: "impossible", hebrew: "בלתי אפשרי" },
            { english: "ordinary", hebrew: "רגיל" },
            { english: "real", hebrew: "אמיתי" },
            { english: "simple", hebrew: "פשוט" },
            { english: "wonderful", hebrew: "נהדר" },
            { english: "although", hebrew: "למרות" },
            { english: "especially", hebrew: "במיוחד" },
            { english: "in fact", hebrew: "למעשה" },
            { english: "throughout", hebrew: "לאורך / בכל" }
        ];

        const colors = ["#FFADAD", "#FFD6A5", "#FDFFB6", "#CAFFBF", "#9BF6FF", "#A0C4FF", "#BDB2FF", "#FFC6FF"];
        let currentIndex = 0;
        let showingEnglish = true;

        function flipCard() {
            showingEnglish = !showingEnglish;
            document.getElementById("word").innerText = showingEnglish ? flashcards[currentIndex].english : flashcards[currentIndex].hebrew;
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % flashcards.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
            updateCard();
        }

        function updateCard() {
            showingEnglish = true;
            const card = document.getElementById("flashcard");
            card.style.opacity = 0;
            setTimeout(() => {
                document.getElementById("word").innerText = flashcards[currentIndex].english;
                card.style.backgroundColor = colors[currentIndex % colors.length];
                card.style.opacity = 1;
            }, 300);
        }

        function speakWord() {
            const word = flashcards[currentIndex].english;
            const speech = new SpeechSynthesisUtterance(word);
            speech.lang = "en-US";
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
